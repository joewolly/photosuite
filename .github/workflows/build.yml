# PhotoSuite CI: lint the JS tree, then bundle installers on GitHub-hosted runners.
#
# Artifacts per run:
#   PhotoSuite-macos    universal (arm64 + x86_64) .dmg
#   PhotoSuite-windows  x64 NSIS .exe installer
#   PhotoSuite-linux    x64 .deb and .rpm
#
# Installers are only built for a `v*` tag push (or a manual workflow_dispatch run),
# not on a plain push to main. A tag push additionally publishes those files to a
# draft GitHub Release.
#
# macOS signing and notarization are opt-in: without the Apple secrets the job
# still builds and produces an unsigned .dmg. See "Apple secrets" below.

name: PhotoSuite

on:
  # Check every branch push and PR merge result, including same-repository PRs.
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: photosuite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-js:
    name: Lint and test (JavaScript)
    runs-on: ubuntu-latest
    steps:
      # The suite imports modules that load vendor scripts from the submodules.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run prepare:frontend
      - run: npm run lint
      - run: npm run verify
      - run: npm test

  check-rust:
    name: Check and test (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libcups2-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-rust
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci
      - run: npm run prepare:frontend
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      # Real ComfyUI/model tests remain ignored and explicitly opt-in.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: node scripts/gen-crate-notices.mjs --check

  # Installers are built only for a release tag or a run started by hand.
  # A push to main (or any other branch) gets the checks above and stops there.
  build:
    name: Build (${{ matrix.label }})
    needs: [check-js, check-rust]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal
            os: macos-latest
            artifact: PhotoSuite-macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

          - label: Windows x64
            os: windows-latest
            artifact: PhotoSuite-windows
            rust_targets: ''
            tauri_args: ''
            bundle_paths: |
              src-tauri/target/release/bundle/nsis/*.exe

          - label: Linux x64
            os: ubuntu-24.04
            artifact: PhotoSuite-linux
            rust_targets: ''
            # The large embedded models make rpm-rs's default gzip bundling
            # extremely slow. Keep the override scoped to hosted packaging.
            tauri_args: >-
              --config '{"bundle":{"linux":{"rpm":{"compression":{"type":"zstd","level":3}}}}}'
            bundle_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

    # The `secrets` context cannot be read from a step-level `if`, so the guard
    # value is lifted to the job environment and the steps test `env.` instead.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      # src/index.html script-loads UPNG, UZIP, pako, PDFI and friends straight
      # out of their submodule working trees, so a shallow checkout builds an app
      # whose vendor <script> tags all 404.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libcups2-dev \
            build-essential \
            file \
            patchelf \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      # Tauri beforeBuildCommand stages and verifies the runtime frontend.

      # Apple secrets, all optional — set every one of them to get a signed and
      # notarized .dmg, set none to get an unsigned one:
      #   APPLE_CERTIFICATE           base64 of a Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD  that .p12's export password
      #   KEYCHAIN_PASSWORD           any string; unlocks the throwaway keychain
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_P8            base64 of the App Store Connect .p8 key
      #   APPLE_API_KEY_ID            that key's ID
      #   APPLE_API_ISSUER            the issuer UUID
      - name: Set up Apple code signing
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          # A dedicated keychain added to the search list, rather than replacing
          # the runner's default one, so nothing else on the runner is disturbed.
          KEYCHAIN="$RUNNER_TEMP/photosuite-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          # Tauri notarizes only when all three are present. APPLE_API_KEY is the
          # key *ID*; the .p8 itself is referenced by path.
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      # `--target` is a tauri flag; putting it after `--` would hand it to cargo
      # and leave the bundler looking in the wrong target directory.
      - name: Tauri build
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Flatten nested subdirectories created by actions/download-artifact (e.g. deb/, rpm/)
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete

          # If the release was already created (e.g. on retry or prior partial run), upload assets directly
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, uploading assets..."
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              dist/*
          else
            echo "Creating draft release $GITHUB_REF_NAME..."
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PhotoSuite $GITHUB_REF_NAME" \
              --generate-notes \
              --draft \
              dist/*
          fi
